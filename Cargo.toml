[workspace]
resolver = "2"
members = [
    "crates/anmixiu",
    "crates/core",
    "crates/reactive",
    "crates/scene",
    "crates/layout-taffy",
    "crates/runtime",
    "crates/platform-native",
    "crates/render-metal",
    "crates/render-d3d11",
    "crates/text-coretext",
    "crates/text-directwrite",
    "crates/platform-macos",
    "crates/platform-windows",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
anmixiu = { path = "crates/anmixiu", version = "0.1.0" }
anmixiu-core = { path = "crates/core", version = "0.1.0" }
anmixiu-reactive = { path = "crates/reactive", version = "0.1.0" }
anmixiu-scene = { path = "crates/scene", version = "0.1.0" }
anmixiu-layout-taffy = { path = "crates/layout-taffy", version = "0.1.0" }
anmixiu-runtime = { path = "crates/runtime", version = "0.1.0" }
anmixiu-platform-native = { path = "crates/platform-native", version = "0.1.0" }
anmixiu-render-metal = { path = "crates/render-metal", version = "0.1.0" }
anmixiu-render-d3d11 = { path = "crates/render-d3d11", version = "0.1.0" }
anmixiu-text-coretext = { path = "crates/text-coretext", version = "0.1.0" }
anmixiu-text-directwrite = { path = "crates/text-directwrite", version = "0.1.0" }
anmixiu-platform-macos = { path = "crates/platform-macos", version = "0.1.0" }
anmixiu-platform-windows = { path = "crates/platform-windows", version = "0.1.0" }
async-task = "4.7.1"
bitflags = "2.9.4"
core-graphics = "0.25.0"
core-foundation = "0.10.1"
core-text = "22.0.0"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support", "plotters"] }
metal = "0.33.0"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-quartz-core = { version = "0.3.2", default-features = false }
parking_lot = "0.12.4"
smol_str = "0.3.6"
stats_alloc = "0.1.10"
taffy = { version = "0.9.1", default-features = false, features = ["std", "flexbox"] }
thiserror = "2.0.16"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["fmt", "ansi"] }
tokio = { version = "1.47.1", default-features = false, features = ["rt-multi-thread", "time", "sync", "net", "io-util", "macros"] }
windows = { version = "0.62.2", default-features = false, features = ["std"] }
windows-core = "0.62.2"
windows-numerics = "0.3.1"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
