[workspace]
resolver = "2"
members = [
    "crates/anmixiu",
    "crates/core",
    "crates/reactive",
    "crates/scene",
    "crates/runtime",
    "crates/platform",
    "crates/render",
    "crates/text",
    "crates/macros",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/veltrum-dev/anmixiu"
rust-version = "1.89"

[workspace.dependencies]
anmixiu = { path = "crates/anmixiu", version = "0.1.0" }
anmixiu-core = { path = "crates/core", version = "0.1.0" }
anmixiu-reactive = { path = "crates/reactive", version = "0.1.0" }
anmixiu-scene = { path = "crates/scene", version = "0.1.0" }
anmixiu-runtime = { path = "crates/runtime", version = "0.1.0" }
anmixiu-platform = { path = "crates/platform", version = "0.1.0" }
anmixiu-render = { path = "crates/render", version = "0.1.0" }
anmixiu-text = { path = "crates/text", version = "0.1.0" }
anmixiu-macros = { path = "crates/macros", version = "0.1.0" }
async-task = "4.7.1"
bytemuck = { version = "1.24.0", features = ["derive"] }
core-graphics = "0.25.0"
core-foundation = "0.10.1"
core-text = "22.0.0"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support", "plotters"] }
pollster = "0.4.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
smol_str = "0.3.6"
stats_alloc = "0.1.10"
taffy = { version = "0.9.1", default-features = false, features = ["std", "flexbox", "taffy_tree"] }
thiserror = "2.0.16"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["fmt", "ansi"] }
tokio = { version = "1.47.1", default-features = false, features = ["rt-multi-thread", "time", "sync", "net", "io-util", "macros"] }
syn = { version = "2.0.119", features = ["derive", "parsing"] }
windows = { version = "0.62.2", default-features = false, features = ["std"] }
windows-core = "0.62.2"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
