[package]
name = "anmixiu-platform-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
devtools = ["anmixiu-core/devtools", "anmixiu-platform-native/devtools"]

[dependencies]
anmixiu-core.workspace = true
anmixiu-platform-native.workspace = true
anmixiu-reactive.workspace = true
anmixiu-render-d3d11.workspace = true
anmixiu-runtime.workspace = true
anmixiu-scene.workspace = true
anmixiu-text-directwrite.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
